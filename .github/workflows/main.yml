name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Check (`--features="serde_serialization"`)
        run: cargo check --features="serde_serialization"
      - name: Check (`--features="num_traits"`)
        run: cargo check --features="num_traits"
      - name: Check (`--features="to_css"`)
        run: cargo check --features="to_css"

  build_result:
    name: Result
    runs-on: ubuntu-latest
    needs:
      - "Test"
    steps:
      - name: Mark the job as successful
        run: exit 0
        if: success()
      - name: Mark the job as unsuccessful
        run: exit 1
        if: "!success()"
